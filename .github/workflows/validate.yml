name: Validate prototype

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-and-patch-checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          set -euo pipefail
          bash -n build-super-image.sh
          bash -n validate-super-image.sh
          bash -n prepare-initramfs.sh
          bash -n integration/stage-batocera-init.sh
          bash -n integration/prepare-pmaports-handoff.sh
          bash -n integration/tests/test-prepare-pmaports-handoff.sh
          bash -n scripts/inspect-android-boot-image.sh
          bash -n integration/tests/test-inspect-android-boot-image.sh
          sh -n init
          bash integration/tests/test-prepare-pmaports-handoff.sh
          bash integration/tests/test-inspect-android-boot-image.sh

      - name: Validate integration patch format
        run: git apply --numstat integration/postmarketos-initramfs/0001-armdeck-batocera-handoff.patch

      - name: Confirm no flashing commands in build scripts
        run: |
          if grep -En 'fastboot[[:space:]]+flash|dd[[:space:]].*of=/dev/' build-super-image.sh validate-super-image.sh prepare-initramfs.sh init scripts/*.sh integration/*.sh; then
            echo 'Unexpected direct device-writing command found.' >&2
            exit 1
          fi

      - name: Write validation report
        if: always()
        run: |
          {
            echo "Prototype validation report"
            echo "Commit: $GITHUB_SHA"
            echo "Event: $GITHUB_EVENT_NAME"
            echo "Runner: $RUNNER_OS"
            echo
            echo "Shell syntax and handoff fixture: see Validate shell syntax step"
            echo "Integration patch numstat:"
            git apply --numstat integration/postmarketos-initramfs/0001-armdeck-batocera-handoff.patch || true
            echo
            echo "This workflow does not build or publish a flashable phone image."
          } > validation-report.txt
          cat validation-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation report and docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-validation-${{ github.sha }}
          path: |
            validation-report.txt
            README.md
            INTEGRATION-NOTES.md
            docs/
          if-no-files-found: error
          retention-days: 14
