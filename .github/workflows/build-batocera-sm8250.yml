name: Build Batocera SM8250 baseline

# This is an explicit, expensive build on a dedicated self-hosted runner.
# It builds the generic upstream SM8250 baseline only; it is NOT a OnePlus image.
on:
  workflow_dispatch:
    inputs:
      batocera_ref:
        description: Exact Batocera commit SHA (40 hexadecimal characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: batocera-sm8250-${{ inputs.batocera_ref }}
  cancel-in-progress: false

jobs:
  build-baseline:
    # Configure this runner with Linux x86_64, Docker, make, git, and ample free disk.
    # Do not use a normal hosted runner without first confirming disk capacity.
    runs-on: [self-hosted, linux, x64, batocera-builder]
    timeout-minutes: 1440
    steps:
      - name: Validate requested source revision
        env:
          BATOCERA_REF: ${{ inputs.batocera_ref }}
        run: |
          set -euo pipefail
          [[ "$BATOCERA_REF" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo 'batocera_ref must be a full 40-character commit SHA.' >&2
            exit 2
          }
          command -v git
          command -v make
          command -v docker
          docker info >/dev/null
          df -h .

      - name: Fetch exact Batocera source
        env:
          BATOCERA_REF: ${{ inputs.batocera_ref }}
        run: |
          set -euo pipefail
          git clone https://github.com/batocera-linux/batocera.linux.git batocera-src
          git -C batocera-src fetch --depth=1 origin "$BATOCERA_REF"
          git -C batocera-src checkout --detach FETCH_HEAD
          actual="$(git -C batocera-src rev-parse HEAD)"
          [[ "${actual,,}" == "${BATOCERA_REF,,}" ]]
          git -C batocera-src submodule update --init --recursive
          printf 'BATOCERA_COMMIT=%s\n' "$actual" > source-manifest.env
          git -C batocera-src status --short

      - name: Build generic SM8250 baseline
        working-directory: batocera-src
        run: |
          set -o pipefail
          make sm8250-build 2>&1 | tee ../batocera-build.log

      - name: Validate and stage build outputs
        run: |
          set -euo pipefail
          mkdir -p artifact/batocera-images
          if [[ -d batocera-src/output/sm8250/images ]]; then
            cp -a batocera-src/output/sm8250/images/. artifact/batocera-images/
          fi
          find artifact -type f -printf '%P\t%s bytes\n' | sort | tee artifact-file-list.txt
          if ! find artifact -type f \( -iname '*.squashfs' -o -iname '*batocera*' \) -print -quit | grep -q .; then
            echo 'No expected Batocera image artifacts found; inspect build output paths.' >&2
            find batocera-src/output/sm8250 -maxdepth 4 -type f -printf '%p\n' 2>/dev/null | head -200 || true
            exit 1
          fi
          cp source-manifest.env artifact/
          cp artifact-file-list.txt artifact/
          sha256sum artifact/batocera-images/* > artifact/SHA256SUMS 2>/dev/null || true
          {
            echo '## Generic Batocera SM8250 baseline'
            echo
            echo '**Not a OnePlus 8 flashable image.** This workflow does not build ARMDeck, the OnePlus kernel/device tree, the Android boot image, or the embedded super image.'
            echo
            echo 'Source revision:'
            echo '```'
            cat source-manifest.env
            echo '```'
            echo
            echo 'Artifacts:'
            cat artifact-file-list.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload baseline build outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batocera-sm8250-baseline-${{ inputs.batocera_ref }}
          path: |
            artifact/
            batocera-build.log
            source-manifest.env
          if-no-files-found: warn
          retention-days: 14
