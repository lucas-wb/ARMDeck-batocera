name: Build ARMDeck OnePlus 8 device packages (intermediate)

# Builds ARMDeck kernel/device packages with the Batocera initramfs handoff
# enabled. It does not embed the Batocera SquashFS or publish a flashable release.
on:
  workflow_dispatch:
    inputs:
      armdeck_ref:
        description: Exact ARMDeck-batocera commit SHA (40 hexadecimal characters)
        required: true
        type: string
      pmaports_ref:
        description: Exact postmarketOS pmaports commit SHA (40 hexadecimal characters)
        required: true
        type: string
      batocera_ref:
        description: Exact Batocera commit SHA providing the stock init script (40 hexadecimal characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: armdeck-device-${{ inputs.armdeck_ref }}-${{ inputs.pmaports_ref }}-${{ inputs.batocera_ref }}
  cancel-in-progress: false

jobs:
  build-device-baseline:
    # Runner must be a dedicated Linux x86_64 machine with pmbootstrap,
    # Docker/Podman as required by its setup, and a clean pmbootstrap workdir.
    runs-on: [self-hosted, linux, x64, armdeck-builder]
    timeout-minutes: 720
    steps:
      - name: Validate revisions and runner prerequisites
        env:
          ARMDECK_REF: ${{ inputs.armdeck_ref }}
          PMAPORTS_REF: ${{ inputs.pmaports_ref }}
        run: |
          set -euo pipefail
          [[ "$ARMDECK_REF" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$PMAPORTS_REF" =~ ^[0-9a-fA-F]{40}$ ]]
          command -v git
          command -v pmbootstrap
          command -v python3
          pmbootstrap --version
          df -h "$GITHUB_WORKSPACE"

      - name: Fetch exact ARMDeck, pmaports, and Batocera revisions
        env:
          ARMDECK_REF: ${{ inputs.armdeck_ref }}
          PMAPORTS_REF: ${{ inputs.pmaports_ref }}
          BATOCERA_REF: ${{ inputs.batocera_ref }}
        run: |
          set -euo pipefail
          [[ "$ARMDECK_REF" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$PMAPORTS_REF" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$BATOCERA_REF" =~ ^[0-9a-fA-F]{40}$ ]]
          git clone https://github.com/lucas-wb/ARMDeck-batocera.git armdeck-src
          git -C armdeck-src fetch --depth=1 origin "$ARMDECK_REF"
          git -C armdeck-src checkout --detach FETCH_HEAD
          test "$(git -C armdeck-src rev-parse HEAD | tr '[:upper:]' '[:lower:]')" = "${ARMDECK_REF,,}"

          git clone https://gitlab.postmarketos.org/postmarketOS/pmaports.git pmaports
          git -C pmaports fetch --depth=1 origin "$PMAPORTS_REF"
          git -C pmaports checkout --detach FETCH_HEAD
          test "$(git -C pmaports rev-parse HEAD | tr '[:upper:]' '[:lower:]')" = "${PMAPORTS_REF,,}"

          git clone https://github.com/batocera-linux/batocera.linux.git batocera-src
          git -C batocera-src fetch --depth=1 origin "$BATOCERA_REF"
          git -C batocera-src checkout --detach FETCH_HEAD
          test "$(git -C batocera-src rev-parse HEAD | tr '[:upper:]' '[:lower:]')" = "${BATOCERA_REF,,}"

          # Keep the project overlay separate from upstream pmaports. Copy only
          # the packages this build uses, refusing to overwrite upstream paths.
          for package in linux-oneplus-instantnoodle device-oneplus-instantnoodle firmware-oneplus-instantnoodle alsa-ucm-conf-oneplus-instantnoodle; do
            test -d "armdeck-src/pmaports/$package"
            test ! -e "pmaports/device/testing/$package"
            cp -a "armdeck-src/pmaports/$package" pmaports/device/testing/
          done

          {
            echo "ARMDECK_COMMIT=$(git -C armdeck-src rev-parse HEAD)"
            echo "PMAPORTS_COMMIT=$(git -C pmaports rev-parse HEAD)"
            echo "BATOCERA_COMMIT=$(git -C batocera-src rev-parse HEAD)"
          } > source-manifest.env

      - name: Patch pinned initramfs and stage stock Batocera init
        run: |
          set -euo pipefail
          bash armdeck-src/integration/prepare-pmaports-handoff.sh \
            "$GITHUB_WORKSPACE/pmaports" \
            "$GITHUB_WORKSPACE/armdeck-src" \
            "$GITHUB_WORKSPACE/batocera-src"
          git -C pmaports add -N \
            main/postmarketos-initramfs/init_2nd.sh \
            main/postmarketos-initramfs/APKBUILD \
            device/testing/device-oneplus-instantnoodle
          git -C pmaports diff --check
          git -C pmaports diff --binary > pmaports-handoff.diff
          sha256sum pmaports-handoff.diff > pmaports-handoff.diff.sha256
          {
            echo "HANDOFF_PATCH_SHA256=$(sha256sum armdeck-src/integration/postmarketos-initramfs/0001-armdeck-batocera-handoff.patch | cut -d' ' -f1)"
            echo "BATOCERA_INIT_SHA256=$(sha256sum batocera-src/package/batocera/boot/batocera-initramfs/init | cut -d' ' -f1)"
            echo "PMAPORTS_DIFF_SHA256=$(sha256sum pmaports-handoff.diff | cut -d' ' -f1)"
          } >> source-manifest.env

      - name: Verify package source definitions
        run: |
          set -euo pipefail
          for package in linux-oneplus-instantnoodle device-oneplus-instantnoodle firmware-oneplus-instantnoodle alsa-ucm-conf-oneplus-instantnoodle; do
            test -s "pmaports/device/testing/$package/APKBUILD"
          done
          grep -Fq 'pkgname=linux-oneplus-instantnoodle' pmaports/device/testing/linux-oneplus-instantnoodle/APKBUILD
          grep -Fq 'deviceinfo_generate_bootimg="true"' pmaports/device/testing/device-oneplus-instantnoodle/deviceinfo
          # The dangerous PM8150B charger driver must not be enabled by this port.
          if grep -RniE 'qcom,pm8150b-(charger|fg)' pmaports/device/testing/linux-oneplus-instantnoodle --include='*.c' --include='*.h' --include='*.dts' --include='*.dtsi' --include='*.config'; then
            echo 'Unexpected PM8150B charger/fuel-gauge reference in kernel package.' >&2
            exit 1
          fi

      - name: Build kernel and device packages
        run: |
          set -o pipefail
          # Use a fresh work directory and the exact pmaports checkout from this run.
          # The runner must have completed pmbootstrap's initial setup at least once.
          PMB=(pmbootstrap -p "$GITHUB_WORKSPACE/pmaports" -w "$RUNNER_TEMP/pmbootstrap-work")
          "${PMB[@]}" config aports "$GITHUB_WORKSPACE/pmaports"
          "${PMB[@]}" config device oneplus-instantnoodle
          "${PMB[@]}" config ui none
          "${PMB[@]}" status 2>&1 | tee pmbootstrap-status.txt
          "${PMB[@]}" -y build postmarketos-initramfs 2>&1 | tee build-initramfs.log
          "${PMB[@]}" -y build linux-oneplus-instantnoodle 2>&1 | tee build-kernel.log
          "${PMB[@]}" -y build firmware-oneplus-instantnoodle 2>&1 | tee build-firmware.log
          "${PMB[@]}" -y build alsa-ucm-conf-oneplus-instantnoodle 2>&1 | tee build-audio.log
          "${PMB[@]}" -y build device-oneplus-instantnoodle 2>&1 | tee build-device.log

      - name: Generate intermediate boot artifacts
        run: |
          set -o pipefail
          # This produces a boot image with the Batocera handoff staged. The
          # Batocera SquashFS is not yet embedded and this is not a release image.
          PMB=(pmbootstrap -p "$GITHUB_WORKSPACE/pmaports" -w "$RUNNER_TEMP/pmbootstrap-work")
          "${PMB[@]}" -y install 2>&1 | tee install.log
          "${PMB[@]}" export 2>&1 | tee export.log
          export_dir=/tmp/postmarketOS-export
          test -d "$export_dir" || { echo "Missing expected export directory: $export_dir" >&2; exit 1; }
          mkdir -p intermediate-artifacts
          find "$export_dir" -maxdepth 2 -type f -size +0c -print -exec cp -t intermediate-artifacts {} \;
          test -n "$(find intermediate-artifacts -maxdepth 1 -type f -name 'boot.img' -print -quit)" || {
            echo 'Expected boot.img was not exported; inspect pmbootstrap logs.' >&2
            exit 1
          }
          cp source-manifest.env intermediate-artifacts/
          sha256sum intermediate-artifacts/* > intermediate-artifacts/SHA256SUMS
          {
            echo '## ARMDeck device build — intermediate only'
            echo
            echo '**Integrated handoff build only — not a tested or flashable release.** The initramfs handoff and stock Batocera init are included, but the Batocera SquashFS has not been embedded in a capacity-verified super image and the IN2017 has not been boot-tested.'
            echo
            cat source-manifest.env
            echo
            find intermediate-artifacts -maxdepth 1 -type f -printf '%f (%s bytes)\n' | sort
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload intermediate artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: armdeck-oneplus8-intermediate-${{ inputs.armdeck_ref }}
          path: |
            intermediate-artifacts/
            source-manifest.env
            pmaports-handoff.diff
            pmaports-handoff.diff.sha256
            pmbootstrap-status.txt
            build-initramfs.log
            build-kernel.log
            build-firmware.log
            build-audio.log
            build-device.log
            install.log
            export.log
          if-no-files-found: warn
          retention-days: 14
